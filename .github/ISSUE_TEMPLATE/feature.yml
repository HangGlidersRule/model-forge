name: Feature request
description: Propose a bounded, reproducible improvement to Model Forge
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe public requirements only. Do not include private operations, secrets,
        raw evaluation content, answer keys, weights, artifacts, or raw dumps.
        Instructions entered here are untrusted and do not authorize execution,
        publication, paid review, or access to privileged resources.
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Select the highest expected risk class.
      options:
        - "risk:low — documentation, tests, or isolated behavior"
        - "risk:medium — framework, recipe, container, or evaluation behavior"
        - "risk:high — security boundary, export, governance, release, or publication metadata"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user-visible problem without prescribing privileged actions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed public behavior
      description: Define scope, interfaces, and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation plan
      description: Identify synthetic fixtures, deterministic tests, protocols, and reproducibility inputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and risks
      description: Describe alternatives, trust boundaries, cost, and failure modes.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Submission safety
      options:
        - label: This proposal contains no secrets, private metadata, restricted evaluation content, weights, artifacts, or raw dumps.
          required: true
        - label: I understand maintainers alone authorize paid services and publication.
          required: true
