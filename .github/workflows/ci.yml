name: ci

on:
  push:
  pull_request:
  # Phase H1: weekly integrity and security sweep (deterministic, secretless).
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Manifest and governance tests
        run: pytest -q tests/public_export/test_public_file_manifest.py tests/governance
      - name: Shell syntax
        run: git ls-files '*.sh' | xargs -r -n1 bash -n
      - name: Full pytest
        shell: bash
        run: |
          if [[ -e PUBLIC_EXPORT_MANIFEST.json ]]; then
            python -c 'import sys; sys.path.insert(0, "tests/public_export"); import test_public_file_manifest as m; m._validate_manifest(m._load_manifest(), m._git_tracked_files())'
            pytest -q -m "not private_source_only"
          else
            pytest -q
          fi
      - name: Whitespace check
        run: git diff --check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        shell: bash
        run: |
          set -eu
          trusted_dir="$RUNNER_TEMP/gitleaks"
          scan_root="$RUNNER_TEMP/gitleaks-scan"
          image='zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f' # v8.30.1
          rm -rf -- "$trusted_dir" "$scan_root"
          install -d -m 0700 "$trusted_dir" "$scan_root"
          printf '%s\n' '[extend]' 'useDefault = true' > "$trusted_dir/config.toml"
          : > "$trusted_dir/.gitleaksignore"
          cp -a -- "$GITHUB_WORKSPACE/." "$scan_root/"
          rm -rf -- "$scan_root/.gitleaks.toml" "$scan_root/.gitleaksignore"
          docker run --rm \
            --volume "$scan_root:/repo:ro" \
            --volume "$trusted_dir:/trusted:ro" \
            "$image" \
            git \
            --config /trusted/config.toml \
            --gitleaks-ignore-path /trusted/.gitleaksignore \
            --no-banner \
            --redact \
            --verbose \
            /repo

  pr-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Classify changed paths
        run: >-
          python -m model_forge.pr_risk
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_WORKSPACE"
          --json pr-risk.json
          --summary pr-risk.md
      - name: Publish job summary
        run: |
          printf '%s\n' 'PR risk classifier completed; see the attached deterministic report.' >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat pr-risk.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload risk report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-risk-${{ github.run_id }}
          path: |
            pr-risk.json
            pr-risk.md
          if-no-files-found: error
          retention-days: 7
