# W4A16 NVFP4 for plain nemotron_h trunks (Nano-Omni campaign v2).
# Matches the SHIPPED Lightning NVFP4 serving artifact layout:
#   - MoE routed + shared experts: NVFP4 (5,894 expert modules + 46 shared)
#   - lm_head: NVFP4 (the CUDA12-era BF16 workaround rule is REMOVED — the
#     cu130-nightly loader expects the packed lm_head; Lightning ships it)
#   - attention q/k/v/o + BMM: NVFP4-adjacent FP8 in the shipped Lightning
#     artifact carried attention scales; recipe `fp8_attn` semantics retained
#   - Mamba/SSM path, norms, embeddings: BF16 protected
imports:
  nvfp4: configs/numerics/nvfp4
metadata:
  recipe_type: ptq
  description: >-
    Plain nemotron_h W4A16 NVFP4 with NVFP4 lm_head (Lightning-shipped
    layout): MoE expert projections + lm_head quantized; attention, Mamba2/SSM
    path, BMM, norms, embeddings protected BF16.
quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
    layerwise: false
  quant_cfg:
    # 1. Disable everything first.
    - quantizer_name: '*'
      enable: false

    # 2. W4A16 NVFP4 on MoE expert projections (fused per-expert and shared).
    - quantizer_name: '*mixer.experts*up_proj_weight_quantizers*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mixer.experts*down_proj_weight_quantizers*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mixer.shared_experts*up_proj*weight_quantizer*'
      cfg: {$import: nvfp4}
    - quantizer_name: '*mixer.shared_experts*down_proj*weight_quantizer*'
      cfg: {$import: nvfp4}

    # 3. lm_head NVFP4 (matches Lightning shipped artifact: packed
    #    [vocab, hidden/2] + weight_scale; loaded by cu130-nightly NVFP4 path).
    - quantizer_name: '*lm_head*'
      cfg: {$import: nvfp4}

    # 4. Attention stays BF16 (vLLM nemotron_h loads attention linear fused
    #    columns; Lightning's quant_summary shows attention disabled).
    - quantizer_name: '*mixer.q_proj*'
      enable: false
    - quantizer_name: '*mixer.k_proj*'
      enable: false
    - quantizer_name: '*mixer.v_proj*'
      enable: false
    - quantizer_name: '*mixer.o_proj*'
      enable: false

    # 5. Nemotron-H exclusions (kept for shared machinery compatibility).
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*embed_vision*'
      enable: false
    - quantizer_name: '*multi_modal_projector*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false

    # 6. BF16-protected Mamba2/SSM path and attention BMM (after enables).
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mixer.in_proj*'
      enable: false
    - quantizer_name: '*mixer.out_proj*'
      enable: false
    - quantizer_name: '*mixer.*_bmm_quantizer*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false
    - quantizer_name: 'backbone.embeddings*'
      enable: false
    - quantizer_name: '*norm*weight*'
      enable: false
