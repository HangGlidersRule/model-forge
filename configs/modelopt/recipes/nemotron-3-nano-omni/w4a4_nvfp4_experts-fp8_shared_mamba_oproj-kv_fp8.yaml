#
# Nemotron-3-Nano-Omni-30B-A3B-Reasoning, issue #35 W4A4 build in NVIDIA's own released NVFP4 layout
# (nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4 @ 16993199, whose hf_quant_config.json this matches entry for
# entry; NVIDIA's card: "routed MoE experts are quantized to NVFP4 ... while the Mamba in_proj / out_proj, shared
# experts, and attention o_proj are quantized to FP8"; KV cache FP8; vision and audio encoders and projectors BF16):
#   routed experts (5,888 linears)          W4A4 NVFP4: static MSE weight scales with the FP8 scale sweep, NVFP4
#                                           activations; one activation scale per layer x projection (fused experts)
#   shared experts, Mamba in/out_proj,      FP8 E4M3 W8A8, per-tensor weight and input scales
#   attention o_proj (46 + 46 + 6)
#   KV cache                                FP8, fixed-range cast (no k/v scales; NVIDIA's checkpoint ships none)
#   attention q/k/v, router, conv1d, lm_head, embeddings, norms, vision tower, audio encoder, projectors: BF16
#
# Calibration method follows NVIDIA's NemotronH omni PTQ recipe on ModelOpt main
# (modelopt_recipes/models/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16/ptq/nvfp4-mse.yaml @ c785ca9d):
# weight-MSE with the FP8 scale sweep, layerwise off (the decoder sits under language_model), vision and audio guards
# last. That recipe puts q/k/v/lm_head in FP8 for Super-VL; this one keeps NVIDIA's Nano-Omni NVFP4 layout instead.
#
# Built from NVIDIA/Model-Optimizer@e2f328a19de789e73b91aca2908042388cf6d496 (0.48.0). quant_cfg is ordered and the
# LAST match wins. ModelOpt validates metadata with extra="forbid": keep it to recipe_type + description.
imports:
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static
  fp8: configs/numerics/fp8
metadata:
  recipe_type: ptq
  description: >-
    Nemotron-3-Nano-Omni W4A4 in NVIDIA's NVFP4 checkpoint layout: W4A4 NVFP4 routed experts (MSE weight scales, NVFP4
    activations); FP8 shared experts, Mamba in/out_proj and attention o_proj; FP8 KV cast; attention q/k/v, router,
    lm_head, embeddings, vision and audio stacks BF16.
quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
    layerwise:
      enable: false
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    # Routed experts: W4A4 NVFP4.
    - quantizer_name: '*mixer.experts.*weight_quantizer*'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mixer.experts.*input_quantizer*'
      cfg:
        $import: nvfp4
    # Shared experts, Mamba projections, attention output projection: FP8 W8A8 per-tensor.
    - quantizer_name: '*mixer.shared_experts.*weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.shared_experts.*input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.in_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.in_proj.input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.out_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.out_proj.input_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.o_proj.weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*mixer.o_proj.input_quantizer'
      cfg:
        $import: fp8
    # KV cache: FP8 at a fixed range (no exported k/v scales), as NVIDIA's NVFP4 checkpoint ships it.
    - quantizer_name: '*[kv]_bmm_quantizer'
      cfg:
        $import: fp8
        use_constant_amax: true
    # Everything outside the language model stays BF16. These guards come last.
    - quantizer_name: '*vision_model*'
      enable: false
    - quantizer_name: '*radio_model*'
      enable: false
    - quantizer_name: '*mlp1*'
      enable: false
    - quantizer_name: '*sound_encoder*'
      enable: false
    - quantizer_name: '*sound_projection*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.gate*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
