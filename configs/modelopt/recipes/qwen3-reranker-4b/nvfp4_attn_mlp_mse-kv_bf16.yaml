# SPDX-License-Identifier: Apache-2.0
#
# Qwen3-Reranker-4B, candidate B (compute): W4A4 NVFP4 on every transformer-block linear,
# the decoder MLP plus attention q/k/v/o.
#
# Built from NVIDIA/Model-Optimizer@ff2450c15eb5f1697ec0471704d5421d54fce4f4 (0.48.0rc1)
# recipe units, same numerics and algorithm as candidate A. KV cache stays BF16
# (run hf_ptq.py with --kv_cache_qformat none).
#
# q/k/v all take the same precision, so vLLM's fused qkv_proj and gate_up_proj groups stay
# uniform. BF16: embed_tokens (tied to lm_head, the classifier source), q_norm/k_norm and
# all other norms.
#
# ModelOpt validates metadata with extra="forbid": keep it to recipe_type + description.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static

metadata:
  recipe_type: ptq
  description: >-
    Qwen3-Reranker-4B candidate B: W4A4 NVFP4 on decoder MLP and attention q/k/v/o with MSE
    static weight scales and dynamic NVFP4 activations. Embeddings and norms stay BF16; KV
    cache BF16.
quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
    layerwise:
      enable: false
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*mlp*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*mlp*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*self_attn*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*self_attn*input_quantizer'
      cfg:
        $import: nvfp4
    - $import: default_disabled_quantizers
