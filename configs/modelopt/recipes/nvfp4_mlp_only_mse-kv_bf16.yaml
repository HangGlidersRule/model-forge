#
# Locally tuned copy of upstream:
#   modelopt_recipes/general/ptq/nvfp4_mlp_only_mse-kv_fp8_cast.yaml
# at NVIDIA/Model-Optimizer@43fd41a58d52c4e6e5dec1d1ff5989ecc737ae1a (0.46.0rc2).
#
# Delta from upstream:
# - FP8 KV cast import/rules removed so export/runtime KV stays BF16.
# - Explicit final exclusions appended (last-match-wins) for vision, MTP, and
#   GatedDeltaNet sensitive projections.
#
# Numerics are inlined so this file is self-contained for hashing and dry-run
# policy resolution without requiring ModelOpt's $import loader at validate time.

metadata:
  recipe_type: ptq
  candidate: primary
  description: >-
    W4A4 NVFP4 (group 16) on language MLP gate/up/down only, with MSE-refined
    static weight scales and dynamic NVFP4 activations. Full attention,
    GatedDeltaNet, vision, MTP, lm_head, embeddings, and norms stay BF16.
    No FP8 KV metadata.
  modelopt_commit: 43fd41a58d52c4e6e5dec1d1ff5989ecc737ae1a
  modelopt_version: 0.46.0rc2
  kv_dtype: bf16
  weight_format: nvfp4_w4a4_group16
  algorithm: mse

quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
    layerwise:
      enable: false
  quant_cfg:
    # Disable everything, then selectively re-enable language MLP.
    - quantizer_name: "*"
      enable: false

    # Language MLP / MoE (static NVFP4 weights from MSE FP8-scale sweep).
    - quantizer_name: "*mlp*weight_quantizer"
      cfg: &nvfp4_static
        num_bits: e2m1
        block_sizes:
          -1: 16
          type: static
        scale_bits: e4m3
    - quantizer_name: "*mlp*input_quantizer"
      cfg: &nvfp4_dynamic
        num_bits: e2m1
        block_sizes:
          -1: 16
          type: dynamic
        scale_bits: e4m3
        effective_bits: 4.5
    - quantizer_name: "*.mixer.up_proj.weight_quantizer"
      cfg: *nvfp4_static
    - quantizer_name: "*.mixer.up_proj.input_quantizer"
      cfg: *nvfp4_dynamic
    - quantizer_name: "*.mixer.down_proj.weight_quantizer"
      cfg: *nvfp4_static
    - quantizer_name: "*.mixer.down_proj.input_quantizer"
      cfg: *nvfp4_dynamic
    - quantizer_name: "*block_sparse_moe*weight_quantizer"
      cfg: *nvfp4_static
    - quantizer_name: "*block_sparse_moe*input_quantizer"
      cfg: *nvfp4_dynamic
    - quantizer_name: "*.experts.*weight_quantizer"
      cfg: *nvfp4_static
    - quantizer_name: "*.experts.*input_quantizer"
      cfg: *nvfp4_dynamic

    # Standard high-precision protections (mirrors default_disabled_quantizers).
    - quantizer_name: "*block_sparse_moe.gate*"
      enable: false
    - quantizer_name: "*linear_attn.conv1d*"
      enable: false
    - quantizer_name: "*linear_attn.in_proj_a*"
      enable: false
    - quantizer_name: "*linear_attn.in_proj_b*"
      enable: false
    - quantizer_name: "*lm_head*"
      enable: false
    - quantizer_name: "*mixer.conv1d*"
      enable: false
    - quantizer_name: "*mlp.gate.*"
      enable: false
    - quantizer_name: "*mlp.shared_expert_gate.*"
      enable: false
    - quantizer_name: "*output_layer*"
      enable: false
    - quantizer_name: "*proj_out.*"
      enable: false
    - quantizer_name: "*router*"
      enable: false
    - quantizer_name: "mtp.*"
      enable: false
    - quantizer_name: "output.*"
      enable: false
    - parent_class: "nn.BatchNorm1d"
      quantizer_name: "*"
      enable: false
    - parent_class: "nn.BatchNorm2d"
      quantizer_name: "*"
      enable: false
    - parent_class: "nn.BatchNorm3d"
      quantizer_name: "*"
      enable: false
    - parent_class: "nn.LeakyReLU"
      quantizer_name: "*"
      enable: false
    - parent_class: "nn.Embedding"
      quantizer_name: "*"
      enable: false

    # Explicit final exclusions (last-match-wins). Must stay after *mlp* enables.
    - quantizer_name: "*visual*"
      enable: false
    - quantizer_name: "*vision_tower*"
      enable: false
    - quantizer_name: "*vision_model*"
      enable: false
    - quantizer_name: "*embed_vision*"
      enable: false
    - quantizer_name: "*multi_modal_projector*"
      enable: false
    - quantizer_name: "*mtp*"
      enable: false
    - quantizer_name: "*linear_attn.conv1d*"
      enable: false
    - quantizer_name: "*linear_attn.in_proj_a*"
      enable: false
    - quantizer_name: "*linear_attn.in_proj_b*"
      enable: false
