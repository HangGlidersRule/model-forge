# SPDX-License-Identifier: Apache-2.0
#
# Nemotron-3.5-Rerank-8B, candidate B (issue #32): W4A4 NVFP4 on the text tower's MLP linears (nvfp4_act_headroom
# activation calibration, MSE FP8-scale weight sweeps) and FP8 W8A8 per-tensor on the text tower's attention q/k/v/o.
# Vision tower, projector, embeddings, norms, score head and KV cache stay BF16. Precision class W4A4-NVFP4-Mixed-FP8.
#
# Built from NVIDIA/Model-Optimizer@e2f328a19de789e73b91aca2908042388cf6d496 (0.48.0).

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static
  fp8: configs/numerics/fp8

metadata:
  recipe_type: ptq
  description: >-
    Nemotron-3.5-Rerank-8B candidate B: W4A4 NVFP4 on the text tower MLP (nvfp4_act_headroom), FP8 W8A8 on text-tower
    attention q/k/v/o. Vision tower, projector, score head and KV cache BF16.
quantize:
  algorithm:
    method: nvfp4_act_headroom
    anchor_percentile: 1
    upper_percentile: 99.99
    rho: 16384
    weight_scale_algorithm:
      method: mse
      fp8_scale_sweep: true
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*language_model*mlp*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*language_model*mlp*input_quantizer'
      cfg:
        $import: nvfp4
    - quantizer_name: '*language_model*self_attn*weight_quantizer'
      cfg:
        $import: fp8
    - quantizer_name: '*language_model*self_attn*input_quantizer'
      cfg:
        $import: fp8
    - $import: default_disabled_quantizers
