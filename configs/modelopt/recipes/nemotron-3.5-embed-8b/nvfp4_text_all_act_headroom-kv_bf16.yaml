#
# Nemotron-3.5-Embed-8B, candidate A (issue #33): W4A4 NVFP4 on every text-tower linear (attention q/k/v/o and MLP
# gate/up/down), nvfp4_act_headroom activation
# calibration, MSE FP8-scale weight sweeps. Vision tower, projector, embeddings, norms and KV cache stay BF16.
# Same quantization rules as the Nemotron-3.5-Rerank-8B recipe of the same letter (issue #32).
#
# Built from NVIDIA/Model-Optimizer@e2f328a19de789e73b91aca2908042388cf6d496 (0.48.0).

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  nvfp4: configs/numerics/nvfp4
  nvfp4_static: configs/numerics/nvfp4_static

metadata:
  recipe_type: ptq
  description: >-
    Nemotron-3.5-Embed-8B candidate A: W4A4 NVFP4 on every text-tower linear (attention q/k/v/o and MLP gate/up/down), nvfp4_act_headroom activation
    calibration, MSE weight scales. Vision tower, projector and KV cache BF16.
quantize:
  algorithm:
    method: nvfp4_act_headroom
    anchor_percentile: 1
    upper_percentile: 99.99
    rho: 16384
    weight_scale_algorithm:
      method: mse
      fp8_scale_sweep: true
  quant_cfg:
    - $import: base_disable_all
    - quantizer_name: '*language_model*_proj*weight_quantizer'
      cfg:
        $import: nvfp4_static
    - quantizer_name: '*language_model*_proj*input_quantizer'
      cfg:
        $import: nvfp4
    - $import: default_disabled_quantizers
