[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-forge"
version = "0.1.0"
description = "Reproducible model transform, quantization, serving, and evaluation forge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4", "packaging>=24", "pydantic>=2", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9", "mypy>=1.10", "types-jsonschema", "types-PyYAML"]

[project.scripts]
model-forge = "model_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "private_source_only: requires excluded private evidence, data, or unsanitized operator inputs",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_abliteration.py" = ["E402"]
"tests/test_abliteration_corpus.py" = ["E402"]
"tests/test_quantize_qwen38_nvfp4.py" = ["E402"]
"scripts/qwen3_8/*.py" = ["E402"]

[tool.mypy]
strict = true
files = ["src/model_forge"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "safetensors.*", "transformers.*", "datasets.*", "huggingface_hub.*", "compressed_tensors.*", "llmcompressor.*"]
ignore_missing_imports = true
