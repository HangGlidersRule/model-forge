version: 1
rules:
  - id: private-hermes-guard
    source: ".hermes/**"
    disposition: exclude
    public_destination: null
    reason: Private planning and operator state must never be tracked or exported.
    transformation: null
    owner: private-operations
    max_size_bytes: 1048576
    generated: false
    precedence: 1000
    allow_empty: true

  - id: private-archive-guard
    source: "private_archive/**"
    disposition: exclude
    public_destination: null
    reason: Private dispatcher implementation, policy, state, and abuse tests never cross the public boundary.
    transformation: null
    owner: private-operations
    max_size_bytes: 262144
    generated: false
    precedence: 1000
    # A generated public root contains no private_archive files, so the guard must be
    # allowed to match nothing there. Tests keep the private source classification strict.
    allow_empty: true

  - id: legacy-github-workflows
    source: ".github/**"
    disposition: exclude
    public_destination: null
    reason: Existing private workflows will be replaced by hardened public workflows.
    transformation: null
    owner: release-engineering
    max_size_bytes: 65536
    generated: false
    precedence: 100

  - id: public-ci-workflow
    source: ".github/workflows/ci.yml"
    disposition: copy
    public_destination: "{source}"
    reason: Publish secretless least-privilege CI and deterministic pull-request risk reporting.
    transformation: null
    owner: release-engineering
    max_size_bytes: 32768
    generated: false
    precedence: 200
    resolves:
      - legacy-github-workflows

  - id: public-codeowners
    source: ".github/CODEOWNERS"
    disposition: copy
    public_destination: "{source}"
    reason: Publish verified ownership rules for protected public paths.
    transformation: null
