name: darkstar-qwen38-abliterated-nvfp4
services:
  vllm:
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-darkstar-qwen38-abliterated-modelopt
    runtime: nvidia
    restart: unless-stopped
    ports:
    - ${VLLM_PORT:-8000}:8000
    volumes:
    - ${PUBLIC_ARTIFACT_PATH}:/d/model-forge/artifacts/Qwen3.8-27B-abliterated-performance-mixed-modelopt:ro
    environment:
    - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    command:
    - --model
    - ${PUBLIC_ARTIFACT_PATH}
    - --served-model-name
    - darkstar-qwen38-abliterated-nvfp4
    - --max-model-len
    - '126144'
    - --max-num-seqs
    - '16'
    - --max-num-batched-tokens
    - '32768'
    - --kv-cache-dtype
    - bf16
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --compilation-config
    - '2'
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":10}'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
