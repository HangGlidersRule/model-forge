services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
    runtime: nvidia
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - model-data:/models:ro
      - work-state:/work
    environment:
      - VLLM_MODEL_PATH=${VLLM_MODEL_PATH:-/models/current}
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TP:-1}
      - VLLM_MAX_MODEL_LEN=${VLLM_CTX:-126144}
      - VLLM_KV_CACHE_DTYPE=${VLLM_KV_CACHE_DTYPE:-bf16}
      - VLLM_COMPILATION_MODE=${VLLM_COMPILE:-2}
    # Chunked prefill is always on here: a Compose string command cannot omit a bare
    # flag conditionally, so it is not exposed as an environment toggle.
    # Speculative decoding is OFF by default: generic serving must not assume any family
    # supports MTP. Extra flags (including a family-specific --speculative-config) flow
    # through the single VLLM_EXTRA_ARGS fragment, which defaults to empty.
    command: >-
      --model ${VLLM_MODEL_PATH:-/models/current}
      --tensor-parallel-size ${VLLM_TP:-1}
      --max-model-len ${VLLM_CTX:-126144}
      --kv-cache-dtype ${VLLM_KV_CACHE_DTYPE:-bf16}
      --enable-chunked-prefill
      --compilation-config ${VLLM_COMPILE:-2}
      ${VLLM_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  model-data:
    external: true
    name: ${MODEL_DATA_VOLUME:-model-forge-model-data}
  work-state:
    external: true
    name: ${WORK_STATE_VOLUME:-model-forge-work-state}
