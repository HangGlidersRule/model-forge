name: darkstar-nemotron-3-nano-omni-abliterated-nvfp4
services:
  vllm:
    image: local/vllm-aeon:v0.27.1
    container_name: vllm-darkstar-nemotron-3-nano-omni-abliterated
    runtime: nvidia
    restart: unless-stopped
    ports:
    - ${VLLM_PORT:-8000}:8000
    volumes:
    - ${PUBLIC_ARTIFACT_PATH}:/models/nano-omni-ablit-nvfp4:ro
    environment:
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    command:
    - --model
    - ${PUBLIC_ARTIFACT_PATH}
    - --served-model-name
    - darkstar-nemotron-3-nano-omni-abliterated-nvfp4
    - --trust-remote-code
    - --max-model-len
    - '131072'
    - --max-num-seqs
    - '16'
    - --max-num-batched-tokens
    - '32768'
    - --gpu-memory-utilization
    - '0.90'
    - --kv-cache-dtype
    - bfloat16
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --generation-config
    - vllm
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
