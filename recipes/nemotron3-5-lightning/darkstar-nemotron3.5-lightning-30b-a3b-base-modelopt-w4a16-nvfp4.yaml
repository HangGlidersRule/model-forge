schema_version: "2.0"
name: darkstar-nemotron3.5-lightning-30b-a3b-base-modelopt-w4a16-nvfp4
family: nemotron-3.5-lightning

source:
  model_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  revision: d468880b6ad3c6e0d21377ce7242adaea4cc884d

transforms: []

datasets:
  cnn_dailymail:
    source: abisee/cnn_dailymail
    revision: 96df5e686bee6baa90b8bee7c28b81fa3fa6223d
    sha256: null
  nemotron_post_training:
    source: nvidia/Nemotron-Post-Training-Dataset-v2
    revision: 5c89e01dd720ae0f4058445ed49c5fb68a03c76e
    sha256: null

quantization:
  scheme: NVFP4
  targets: Linear
  group_size: 16
  protected_tensors:
    - mtp
    - norms
    - embeddings
    - ssm
    - conv1d
  ignore:
    - model.embed_tokens.weight
    - 're:.*mtp.*'
    - 're:.*conv1d.*'
    - 're:.*A_log.*'
    - 're:.*mixer\.D$'
    - 're:.*mixer\.dt_bias.*'
    - 're:.*mixer\.in_proj.*'
    - 're:.*mixer\.out_proj.*'
    - 're:.*norm\.weight$'
    - 're:.*ssm.*'
    - model.final_layernorm.weight
  calibration:
    dataset: cnn_dailymail,nemotron-post-training-datasets
    config: modelopt_text_blend_512_512
    samples: 1024
    max_sequence_length: 2048
    pipeline: modelopt_hf_ptq
    shard_size: 5GB

validation:
  max_refusal_leakage: 0.01
  max_benign_kl_divergence: 0.05
  max_perplexity_delta_pct: 5.0
  vision_byte_identical: true
  mtp_present: true

runtime:
  kv_dtype: bf16
  context_length: 262144
  compiled_mode: true
  flash_attention: true
  mtp_depth_initial: 1
  mtp_sweep_range: [1, 2, 3, 4, 5, 6]

performance:
  target_tok_s: 200
  minimum_tok_s: 180
  warmup_repeats: 2
  measure_repeats: 5
  prompt_lengths: [4096, 16384, 49152]

outputs:
  artifact_kind: nvfp4
  publication:
    github: HangGlidersRule/model-forge
    # Unresolved: candidate-specific precision-encoded target will live in the ledger.
    huggingface_nvfp4: null
    ghcr_serve: ghcr.io/hangglidersrule/model-forge-serve
    ghcr_build: ghcr.io/hangglidersrule/model-forge-build
