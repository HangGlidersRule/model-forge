schema_version: "2.0"
name: darkstar-nemotron-3-nano-omni-30b-a3b-reasoning-base-modelopt-w4a16-nvfp4
family: nemotron-3-nano-omni

source:
  model_id: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
  revision: 24e67ea000b7c2837fc8f9488aa2008524fac8ba

transforms:
  - type: quantization
    kind: trunk_only_ptq
    trunk_extract:
      from_wrapper: language_model
      rename_to: backbone
      towers: byte_identical_from_source
    description: >-
      ModelOpt quantization runs on the language trunk extracted as a standalone plain
      nemotron_h checkpoint; the VLM wrapper is reassembled afterward with the vision and
      audio towers byte-identical from the upstream source. Mirrors the Nemotron-3.5-Lightning
      NVFP4 export contract.

datasets:
  cnn_dailymail:
    source: abisee/cnn_dailymail
    revision: 96df5e686bee6baa90b8bee7c28b81fa3fa6223d
    sha256: null
  nemotron_post_training:
    source: nvidia/Nemotron-Post-Training-Dataset-v2
    revision: 5c89e01dd720ae0f4058445ed49c5fb68a03c76e
    sha256: null

quantization:
  targets: Linear
  group_size: 16
  scheme: NVFP4
  framework: nvidia-modelopt
  framework_version: 0.46.0rc2
  framework_pin_commit: 43fd41a58d52c4e6e5dec1d1ff5989ecc737ae1a
  algorithm: mse
  fp8_scale_sweep: true
  quant_grp:
    routed_experts: W4A16_NVFP4
    shared_experts: W4A16_NVFP4
    lm_head: W4A16_NVFP4
  protected_tensors:
    - norms
    - embeddings
    - ssm
    - conv1d
    - vision_model
    - sound_encoder
    - mlp1
    - sound_projection
  ignore:
    - "re:.*vision_model.*"
    - "re:.*sound_encoder.*"
    - "re:.*sound_projection.*"
    - "re:.*mlp1.*"
    - "re:.*mtp.*"
    - "re:.*conv1d.*"
    - "re:.*A_log.*"
    - "re:.*mixer\\.D$"
    - "re:.*mixer\\.dt_bias.*"
    - "re:.*mixer\\.in_proj.*"
    - "re:.*mixer\\.out_proj.*"
    - "re:.*norm\\.weight$"
    - "re:.*ssm.*"
    - "re:.*language_model\\.backbone\\.embeddings.*"
    - "re:.*language_model\\.backbone\\.norm_f.*"
    - "re:.*lm_head.*"
  calibration:
    dataset: cnn_dailymail,nemotron-post-training-dataset-v2
    config: modelopt_text_blend_512_512
    samples: 1024
    max_sequence_length: 2048
    batch_size: 1
    kv_cache_qformat: none
    pipeline: modelopt_hf_ptq
    shard_size: 5GB

validation:
  max_refusal_leakage: 0.01
  quantized_layers_count: 5935
  byte_identical_towers: true
  mm_towers_identical: true
  serving_verified: true

runtime:
  kv_dtype: bf16
  context_length: 131072
  flash_attention: true
  vllm_pin: local/vllm-aeon:v0.27.1
  vllm_moe_backend: MARLIN NvFp4 MoE
  spec_decode: none
  mtp_present: false
  mtp_note: >-
    this hybrid family carries no MTP layers and no compatible drafter (verified); no speculative
    decoding is configured for any Nano-Omni product.

performance:
  measured_weighted_tok_s: 259.75
  prompt_lengths: [4096, 16384, 49152]
  lane_weights: {'4096': 0.6, '16384': 0.3, '49152': 0.1}

outputs:
  artifact_kind: nvfp4
  publication:
    github: HangGlidersRule/model-forge
    huggingface_nvfp4: HangGlidersRule/Darkstar-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-Base-ModelOpt-W4A16-NVFP4
    ghcr_serve: ghcr.io/hangglidersrule/model-forge-serve
    ghcr_build: ghcr.io/hangglidersrule/model-forge-build
