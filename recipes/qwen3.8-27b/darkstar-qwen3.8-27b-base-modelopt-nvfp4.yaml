schema_version: "2.0"
name: darkstar-qwen3.8-27b-base-modelopt-nvfp4
family: qwen3.8-27b

source:
  model_id: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0

transforms: []

datasets:
  cnn_dailymail:
    source: abisee/cnn_dailymail
    revision: 96df5e686bee6baa90b8bee7c28b81fa3fa6223d
    sha256: null
  nemotron_post_training_v2:
    source: nvidia/Nemotron-Post-Training-Dataset-v2
    revision: 5c89e01dd720ae0f4058445ed49c5fb68a03c76e
    sha256: null

quantization:
  scheme: NVFP4
  targets: Linear
  group_size: 16
  protected_tensors:
    - mtp
    - visual
    - conv1d
    - norms
    - embeddings
    - lm_head
  keep_bf16:
    - mtp
    - visual
    - conv1d
    - norms
    - embeddings
    - lm_head
  ignore:
    - lm_head
    - "re:.*visual.*"
    - "re:.*vision_tower.*"
    - "re:.*vision_model.*"
    - "re:.*embed_vision.*"
    - "re:.*multi_modal_projector.*"
    - "re:.*conv1d.*"
    - "re:.*mtp.*"
    - "re:.*self_attn\\.(q|k|v)_proj.*"
    - "re:.*linear_attn.*"
  calibration:
    dataset: cnn_dailymail,nemotron-post-training-dataset-v2
    config: modelopt_text_blend_512_512
    samples: 1024
    max_sequence_length: 2048
    pipeline: modelopt_hf_ptq
    shard_size: 5GB

validation:
  max_refusal_leakage: 0.01
  max_benign_kl_divergence: 0.05
  max_perplexity_delta_pct: 5.0
  vision_byte_identical: true
  mtp_present: true

runtime:
  kv_dtype: bf16
  context_length: 126144
  compiled_mode: true
  flash_attention: true
  mtp_depth_initial: 1
  mtp_sweep_range: [1, 2, 3, 4, 5, 6]

performance:
  target_tok_s: 200
  minimum_tok_s: 180
  warmup_repeats: 2
  measure_repeats: 5
  prompt_lengths: [4096, 16384, 49152]

outputs:
  artifact_kind: nvfp4
  publication:
    github: HangGlidersRule/model-forge
    # Unresolved: this recipe defines the clean ModelOpt build contract, not one precision
    # candidate, so it reserves no repository id. A bare Base-NVFP4 target would hide the
    # precision class. Candidate-specific targets live in the publication-readiness ledger:
    # Darkstar-Qwen3.8-27B-Base-ModelOpt-W4A16-NVFP4-Mixed-FP8 (built) and
    # Darkstar-Qwen3.8-27B-Base-ModelOpt-W4A4-NVFP4 (not built).
    huggingface_nvfp4: null
    ghcr_serve: ghcr.io/hangglidersrule/model-forge-serve
    ghcr_build: ghcr.io/hangglidersrule/model-forge-build
