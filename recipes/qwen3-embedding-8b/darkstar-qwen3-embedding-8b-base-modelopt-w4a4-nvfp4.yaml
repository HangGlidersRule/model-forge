schema_version: "2.0"
name: darkstar-qwen3-embedding-8b-base-modelopt-w4a4-nvfp4
family: qwen3-embedding-8b

# Issue #18, candidate B: every decoder linear (MLP gate/up/down and self-attention q/k/v/o, 36 layers, 252 linears)
# W4A4 NVFP4. Built from the upstream BF16 weights with the pinned ModelOpt 0.48.0rc1 image.
# The export drops the lm_head tensor that transformers' Qwen3ForCausalLM loader initialises at random: the source
# checkpoint has none and the pooling runner never reads it (models/qwen3-embedding-8b/eval/strip_lm_head.py).

source:
  model_id: Qwen/Qwen3-Embedding-8B
  revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af

transforms: []

datasets:
  ms_marco_v1_1:
    source: microsoft/ms_marco
    revision: a47ee7aae8d7d466ba15f9f0bfac3b3681087b3a
    sha256: d643f77fecf055ca31e2da5829f86ba90aa925d151154f6ddfcb49446bbb11c6

quantization:
  scheme: NVFP4
  targets: Linear
  group_size: 16
  framework: nvidia-modelopt
  framework_version: 0.48.0rc1
  framework_pin_commit: ff2450c15eb5f1697ec0471704d5421d54fce4f4
  algorithm: nvfp4_act_headroom
  weight_scale_algorithm: mse
